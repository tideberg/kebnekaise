version: 2
updates:
  - package-ecosystem: npm
    directory: /deploy/matter
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      matter-runtime:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
