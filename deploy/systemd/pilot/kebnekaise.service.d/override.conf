[Unit]
After=kebnekaise-matter.service
Wants=kebnekaise-matter.service

[Service]
ExecStart=
ExecStart=/usr/bin/python3 -m kebnekaise --config /etc/kebnekaise/pilot.json --db /var/lib/kebnekaise/pilot.sqlite3 collect
EnvironmentFile=
UnsetEnvironment=KEBNEKAISE_HA_TOKEN SUPERVISOR_TOKEN
IPAddressDeny=any
IPAddressAllow=localhost
